<main id="main" class="reveal" tabindex="-1">
<section class="hero-page"><div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/en/">Home</a><span aria-hidden="true">/</span><span aria-current="page">Contact</span></nav>
    <h1>Contact us</h1>
    <p class="lead">Send an enquiry or contact us directly.</p>
  </div></section>
  <section class="band"><div class="wrap cta-grid">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div class="office"><p class="eyebrow">Office</p><h2>Khirdalan</h2>
        <dl class="kv"><dt>Address</dt><dd>Hasan Aliyev Street, Khirdalan, Azerbaijan</dd><dt>Phone</dt><dd><a class="tel" href="tel:+994503623038">+994 50 362 30 38</a> <button class="copy" type="button" data-copy="+994 50 362 30 38" aria-label="Copy phone number">Copy</button></dd><dt>E-mail</dt><dd><a class="tel" href="mailto:office@aeec.az">office@aeec.az</a> <button class="copy" type="button" data-copy="office@aeec.az" aria-label="Copy e-mail address">Copy</button></dd><!--@social-row--></dl><!--@whatsapp--></div>
      <figure class="map"><iframe src="https://www.google.com/maps?q=40.468766,49.721946&amp;z=15&amp;hl=en&amp;output=embed" title="AEEC office location on the map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe><figcaption><span>Hasan Aliyev Street, Khirdalan</span><a href="https://www.google.com/maps/search/?api=1&amp;query=40.468766%2C49.721946" target="_blank" rel="noopener noreferrer">Open in Google Maps ↗</a></figcaption></figure>
    </div>
    <form class="form js-form" novalidate aria-label="Enquiry form" data-form="contact">
      <label class="field" for="c-name"><span class="lbl">Full name <span class="req" aria-hidden="true">*</span></span><input id="c-name" name="name" type="text" autocomplete="name" required aria-required="true"></label>
      <label class="field" for="c-co">Company<input id="c-co" name="company" type="text" autocomplete="organization"></label>
      <label class="field" for="c-mail"><span class="lbl">E-mail <span class="req" aria-hidden="true">*</span></span><input id="c-mail" name="email" type="email" autocomplete="email" required aria-required="true"></label>
      <label class="field" for="c-dir">Area of interest<select id="c-dir" name="direction"><option>Energy engineering</option><option>Digital &amp; AI solutions</option><option>Green energy / E-mobility</option><option>AEEC Academy</option><option>Partnership</option></select></label>
      <label class="field full" for="c-msg">Message<textarea id="c-msg" name="message"></textarea></label>
      <label class="check full" for="c-ok"><input id="c-ok" name="consent" type="checkbox" required aria-required="true"><span>I consent to the processing of my personal data for the purpose of answering my enquiry. <a href="/en/privacy/">Privacy policy</a></span></label>
      <p class="req-note full" data-req-note>Fields marked with <span class="req" aria-hidden="true">*</span> are required.</p>
      <noscript><p class="form-ok warn full">JavaScript must be enabled to send this form. Alternatively, write to office@aeec.az or call +994 50 362 30 38.</p></noscript>
      <div class="full"><button class="btn btn-primary" type="submit">Send enquiry <span class="arrow" aria-hidden="true">→</span></button></div>
    </form>
  </div></section>

<main id="main" class="reveal" tabindex="-1">
<section class="hero-page"><div class="wrap">
    <nav class="crumbs" aria-label="Навигационная цепочка"><a href="/ru/">Главная</a><span aria-hidden="true">/</span><span aria-current="page">Контакты</span></nav>
    <h1>Свяжитесь с нами</h1>
    <p class="lead">Отправьте запрос или свяжитесь с нами напрямую.</p>
  </div></section>
  <section class="band"><div class="wrap cta-grid">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div class="office"><p class="eyebrow">Офис</p><h2>Хырдалан</h2>
        <dl class="kv"><dt>Адрес</dt><dd>г. Хырдалан, улица Гасана Алиева, Азербайджан</dd><dt>Телефон</dt><dd><a class="tel" href="tel:+994503623038">+994 50 362 30 38</a> <button class="copy" type="button" data-copy="+994 50 362 30 38" aria-label="Скопировать номер телефона">Копировать</button></dd><dt>E-mail</dt><dd><a class="tel" href="mailto:office@aeec.az">office@aeec.az</a> <button class="copy" type="button" data-copy="office@aeec.az" aria-label="Скопировать адрес e-mail">Копировать</button></dd><!--@social-row--></dl></div>
      <figure class="map"><iframe src="https://www.google.com/maps?q=40.468766,49.721946&amp;z=15&amp;hl=ru&amp;output=embed" title="Офис AEEC на карте" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe><figcaption><span>г. Хырдалан, улица Гасана Алиева</span><a href="https://www.google.com/maps/search/?api=1&amp;query=40.468766%2C49.721946" target="_blank" rel="noopener noreferrer">Открыть в Google Maps ↗</a></figcaption></figure>
    </div>
    <form class="form js-form" novalidate aria-label="Форма запроса" data-form="contact">
      <label class="field" for="c-name"><span class="lbl">Имя и фамилия <span class="req" aria-hidden="true">*</span></span><input id="c-name" name="name" type="text" autocomplete="name" required aria-required="true"></label>
      <label class="field" for="c-co">Компания<input id="c-co" name="company" type="text" autocomplete="organization"></label>
      <label class="field" for="c-mail"><span class="lbl">E-mail <span class="req" aria-hidden="true">*</span></span><input id="c-mail" name="email" type="email" autocomplete="email" required aria-required="true"></label>
      <label class="field" for="c-dir">Направление<select id="c-dir" name="direction"><option>Энергетический инжиниринг</option><option>Цифровые решения и ИИ</option><option>Зелёная энергетика / Электромобильность</option><option>AEEC Academy</option><option>Партнёрство</option></select></label>
      <label class="field full" for="c-msg">Сообщение<textarea id="c-msg" name="message"></textarea></label>
      <label class="check full" for="c-ok"><input id="c-ok" name="consent" type="checkbox" required aria-required="true"><span>Я согласен(на) на обработку моих персональных данных с целью ответа на мой запрос. <a href="/ru/privacy/">Политика конфиденциальности</a></span></label>
      <p class="req-note full" data-req-note>Поля, отмеченные <span class="req" aria-hidden="true">*</span>, обязательны.</p>
      <noscript><p class="form-ok warn full">Для отправки формы в браузере должен быть включён JavaScript. Либо напишите на office@aeec.az или позвоните: +994 50 362 30 38.</p></noscript>
      <div class="full"><button class="btn btn-primary" type="submit">Отправить запрос <span class="arrow" aria-hidden="true">→</span></button></div>
    </form>
  </div></section>
</main>
